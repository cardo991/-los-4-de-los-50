<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#112d40"><title>Descubriendo destino · Las 4 de los 50</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><a href="index.html">✈ LAS 4 DE LOS 50</a><small>200 AÑOS DE AVENTURAS</small></header><main class="wrap"><div class="hero"><div class="eyebrow">Abril 2027 · Cuatro viajeras</div><h1>Descubriendo destino</h1><p>Fotografías, historia y experiencias para compartir.</p></div><div style="margin-top:24px"><div id="detail"></div></div></main><nav class="nav" aria-label="Navegación principal"><a data-nav="index" href="index.html"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></span>Inicio</a><a data-nav="rutas" href="rutas.html"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M8 5v14M15 9h3M15 13h3"/></svg></span>Rutas</a><a class="active" data-nav="destinos" href="destinos.html"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4 17 5-5 4 4 3-3 4 4"/></svg></span>Lugares</a><a data-nav="mapa" href="mapa.html"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/></svg></span>Mapa</a><a data-nav="excursiones" href="excursiones.html"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3c-4.5 0-8 3.4-8 7.5 0 3.5 3.5 6.7 8 10.5 4.5-3.8 8-7 8-10.5C20 6.4 16.5 3 12 3z"/><circle cx="12" cy="10" r="2.5"/></svg></span>Planes</a><a data-nav="monedas" href="monedas.html"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5c-.8-1-2-1.5-3.5-1.5-2 0-3.5 1-3.5 2.5 0 3.5 7 1 7 5 0 1.5-1.5 2.5-3.5 2.5-1.5 0-2.7-.5-3.5-1.5M12 5v14"/></svg></span>Monedas</a></nav><script src="data.js"></script><script>async function loadGallery(key){const p=PLACES[key],target=document.getElementById('gallery');if(!target)return;target.innerHTML='<p class="muted">Buscando fotografías del destino…</p>';try{const url='https://commons.wikimedia.org/w/api.php?origin=*&action=query&generator=search&gsrsearch='+encodeURIComponent(p.search+' filetype:bitmap')+'&gsrnamespace=6&gsrlimit=30&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=850&format=json';const response=await fetch(url);if(!response.ok)throw Error('API');const data=await response.json();const files=Object.values(data.query?.pages||{}).filter(x=>x.imageinfo?.[0]?.thumburl&&/\.(jpg|jpeg|png|webp)$/i.test(x.title)).slice(0,5);if(files.length<5)throw Error('Insufficient photos');target.innerHTML=files.map(x=>{const img=x.imageinfo[0];return '<figure><a href="'+img.descriptionurl+'" target="_blank" rel="noopener noreferrer"><img loading="lazy" src="'+img.thumburl+'" alt="'+x.title.replace(/^File:/,'').replace(/"/g,'&quot;')+'"></a><figcaption>Wikimedia Commons · Ver autor y licencia ↗</figcaption></figure>'}).join('')}catch(e){target.innerHTML='<div class="gallery-placeholder"><p>No se pudieron cargar las cinco fotos desde Wikimedia Commons en este momento.</p><a class="btn" target="_blank" rel="noopener noreferrer" href="https://commons.wikimedia.org/wiki/Special:MediaSearch?type=image&search='+encodeURIComponent(p.search)+'">Ver fotos de '+p.name+' ↗</a></div>'}}const key=new URLSearchParams(location.search).get('destino');const p=PLACES[key];if(!p){document.getElementById('detail').innerHTML='<h2>Destino no encontrado</h2><a href="destinos.html">Volver a destinos</a>'}else{document.title=p.name+' · Las 4 de los 50';document.getElementById('detail').innerHTML='<div class="destination-hero"><div class="eyebrow">Destino · '+p.country+'</div><h1>'+p.name+'</h1><p>'+p.things+'</p><span class="chip">🌤️ Abril: '+p.weather+'</span><span class="chip">🍽️ Comida: '+p.food[2]+' '+p.food[0]+'–'+p.food[1]+'</span></div><h2>La historia detrás del lugar</h2><p>'+p.history+'</p><h2>Galería de fotografías</h2><p class="muted">Cinco fotografías buscadas en Wikimedia Commons; tocá una para ver su fuente y licencia.</p><div class="gallery" id="gallery"></div><h2>Experiencias y excursiones</h2><div class="grid">'+cardsFor(key)+'</div><a class="btn" href="destinos.html">← Todos los destinos</a>';loadGallery(key)}</script></body></html>
