<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#112d40"><title>Descubriendo destino · Las 4 de los 50</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><a href="index.html">✈ LAS 4 DE LOS 50</a><small>200 AÑOS DE AVENTURAS</small></header><main class="wrap"><div class="hero"><div class="eyebrow">Abril 2027 · Cuatro viajeras</div><h1>Descubriendo destino</h1><p>Fotografías, historia y experiencias para compartir.</p></div><div style="margin-top:24px"><div id="detail"></div></div></main><nav class="nav" aria-label="Navegación principal"><a class="" href="index.html"><span>🏠</span>Inicio</a><a class="" href="rutas.html"><span>🎫</span>Rutas</a><a class="active" href="destinos.html"><span>📸</span>Lugares</a><a class="" href="mapa.html"><span>🗺️</span>Mapa</a><a class="" href="excursiones.html"><span>🎈</span>Planes</a><a class="" href="monedas.html"><span>💱</span>Monedas</a></nav><script src="data.js"></script><script>async function loadGallery(key){const p=PLACES[key],target=document.getElementById('gallery');if(!target)return;target.innerHTML='<p class="muted">Buscando fotografías del destino…</p>';try{const url='https://commons.wikimedia.org/w/api.php?origin=*&action=query&generator=search&gsrsearch='+encodeURIComponent(p.search+' filetype:bitmap')+'&gsrnamespace=6&gsrlimit=30&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=850&format=json';const response=await fetch(url);if(!response.ok)throw Error('API');const data=await response.json();const files=Object.values(data.query?.pages||{}).filter(x=>x.imageinfo?.[0]?.thumburl&&/\.(jpg|jpeg|png|webp)$/i.test(x.title)).slice(0,5);if(files.length<5)throw Error('Insufficient photos');target.innerHTML=files.map(x=>{const img=x.imageinfo[0];return '<figure><a href="'+img.descriptionurl+'" target="_blank" rel="noopener noreferrer"><img loading="lazy" src="'+img.thumburl+'" alt="'+x.title.replace(/^File:/,'').replace(/"/g,'&quot;')+'"></a><figcaption>Wikimedia Commons · Ver autor y licencia ↗</figcaption></figure>'}).join('')}catch(e){target.innerHTML='<div class="gallery-placeholder"><p>No se pudieron cargar las cinco fotos desde Wikimedia Commons en este momento.</p><a class="btn" target="_blank" rel="noopener noreferrer" href="https://commons.wikimedia.org/wiki/Special:MediaSearch?type=image&search='+encodeURIComponent(p.search)+'">Ver fotos de '+p.name+' ↗</a></div>'}}const key=new URLSearchParams(location.search).get('destino');const p=PLACES[key];if(!p){document.getElementById('detail').innerHTML='<h2>Destino no encontrado</h2><a href="destinos.html">Volver a destinos</a>'}else{document.title=p.name+' · Las 4 de los 50';document.getElementById('detail').innerHTML='<div class="destination-hero"><div class="eyebrow">Destino · '+p.country+'</div><h1>'+p.name+'</h1><p>'+p.things+'</p><span class="chip">🌤️ Abril: '+p.weather+'</span><span class="chip">🍽️ Comida: '+p.food[2]+' '+p.food[0]+'–'+p.food[1]+'</span></div><h2>La historia detrás del lugar</h2><p>'+p.history+'</p><h2>Galería de fotografías</h2><p class="muted">Cinco fotografías buscadas en Wikimedia Commons; tocá una para ver su fuente y licencia.</p><div class="gallery" id="gallery"></div><h2>Experiencias y excursiones</h2><div class="grid">'+cardsFor(key)+'</div><a class="btn" href="destinos.html">← Todos los destinos</a>';loadGallery(key)}</script></body></html>
